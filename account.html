<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي | MR Global Logistics</title><link rel="stylesheet" href="/simple.css"></head><body><main class="wrap wide"><header class="bar"><a class="brand" href="/">MR GLOBAL LOGISTICS</a><button class="btn secondary" id="logout">تسجيل الخروج</button></header><section class="card"><h1>حسابي وطلباتي</h1><p id="welcome">جارٍ تحميل الحساب...</p><div id="orders"></div></section></main><script>
async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.user){location.href='/auth.html';return}document.querySelector('#welcome').textContent='مرحباً '+me.user.name+' — هذه قائمة طلباتك.';const r=await fetch('/api/orders/mine');const d=await r.json();document.querySelector('#orders').innerHTML=d.orders.length?d.orders.map(o=>`<article class="order"><b>${o.trackingNumber}</b><span class="pill">${o.status}</span><p>${o.fromAddress} ← ${o.toAddress}</p><small>السعر: ${o.price==null?'بانتظار تحديد الإدارة':o.price+' '+o.currency} · ${o.createdAt}</small></article>`).join(''):'<p>لا توجد طلبات حتى الآن. <a href="/#order">أنشئ أول طلب شحن</a></p>'}document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
