<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب العميل | MR Global Logistics</title><link rel="stylesheet" href="/simple.css"></head><body><main class="wrap"><a class="brand" href="/">MR GLOBAL LOGISTICS</a><section class="card"><h1>حساب العميل</h1><p>سجّل الدخول لمتابعة طلباتك أو أنشئ حسابًا جديدًا.</p><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="registerTab">حساب جديد</button></div><form id="authForm"><div id="nameField" hidden><label>الاسم بالكامل</label><input name="name" autocomplete="name"></div><label>رقم الهاتف</label><input name="phone" required autocomplete="tel" placeholder="01xxxxxxxxx"><label>كلمة المرور</label><input name="password" type="password" required minlength="8" autocomplete="current-password"><button class="btn">متابعة</button></form><p id="msg" class="msg"></p><a href="/">العودة للموقع</a></section></main><script>
let mode='login';const form=document.querySelector('#authForm'),msg=document.querySelector('#msg'),nameField=document.querySelector('#nameField');function setMode(m){mode=m;nameField.hidden=m==='login';document.querySelector('#loginTab').classList.toggle('active',m==='login');document.querySelector('#registerTab').classList.toggle('active',m==='register');form.querySelector('[name=password]').autocomplete=m==='login'?'current-password':'new-password'}document.querySelector('#loginTab').onclick=()=>setMode('login');document.querySelector('#registerTab').onclick=()=>setMode('register');form.onsubmit=async e=>{e.preventDefault();msg.textContent='جارٍ المعالجة...';const body=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.user.role==='admin'?'/admin.html':'/account.html'}catch(e){msg.textContent=e.message}};fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.user)location.href=d.user.role==='admin'?'/admin.html':'/account.html'});
</script></body></html>
