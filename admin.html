<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | MR Global Logistics</title><link rel="stylesheet" href="/simple.css"></head><body><main class="wrap wide"><header class="bar"><a class="brand" href="/">MR GLOBAL LOGISTICS · ADMIN</a><button class="btn secondary" id="logout">خروج</button></header><section class="card"><h1>لوحة إدارة الشحنات</h1><p>راجع الطلبات، حدّد السعر، وحدّث حالة كل شحنة.</p><div class="stats" id="stats"></div><div class="tablewrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>المسار</th><th>النوع</th><th>السعر</th><th>الحالة</th><th>حفظ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const statuses=['قيد المراجعة','تم تحديد السعر','تم التأكيد','تم الاستلام','في الطريق','تم التسليم','ملغي'];async function load(){const me=await fetch('/api/auth/me').then(r=>r.json());if(!me.user||me.user.role!=='admin'){location.href='/auth.html';return}const d=await fetch('/api/admin/orders').then(r=>r.json());document.querySelector('#stats').innerHTML=`<div class="stat">كل الطلبات <b>${d.orders.length}</b></div><div class="stat">بانتظار المراجعة <b>${d.orders.filter(x=>x.status==='قيد المراجعة').length}</b></div><div class="stat">تم التسليم <b>${d.orders.filter(x=>x.status==='تم التسليم').length}</b></div>`;document.querySelector('#rows').innerHTML=d.orders.map(o=>`<tr data-id="${o.id}"><td><b>${o.trackingNumber}</b><br><small>${o.createdAt}</small></td><td>${esc(o.customerName)}</td><td>${esc(o.phone)}</td><td>${esc(o.fromAddress)}<br>← ${esc(o.toAddress)}</td><td>${esc(o.type)}</td><td><input class="price" type="number" min="0" step=".01" value="${o.price??''}" placeholder="السعر" style="width:90px"></td><td><select class="status">${statuses.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn save">حفظ</button></td></tr>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr'),id=tr.dataset.id;const r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({price:tr.querySelector('.price').value===''?null:Number(tr.querySelector('.price').value),status:tr.querySelector('.status').value})});const x=await r.json();alert(r.ok?'تم حفظ التعديلات':x.error)})}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();
</script></body></html>
